framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                # 2 s, 6 s, 18 s, 54 s then 162 s: long enough to outlast a minute of rate limiting by Jev
                retry_strategy:
                    max_retries: 5
                    delay: 2000
                    multiplier: 3
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        # Messages pick their transport themselves, with the #[AsMessage] attribute

when@test:
    framework:
        messenger:
            transports:
                # Messages stay in memory, where tests can look at them
                async: 'in-memory://'
